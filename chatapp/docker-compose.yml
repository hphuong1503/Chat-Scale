services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: chatscale
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: pass
    volumes: ['./data/postgres:/var/lib/postgresql/data']

  redis:
    image: redis:7
    command: ["redis-server", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: bash -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn chatapp.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --reload"
    ports: ['8000:8000']
    depends_on: ['postgres','redis']
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles

  worker:
    build: .
    command: celery -A chatapp worker --loglevel=info
    depends_on: ['redis','postgres']
    volumes:
      - .:/app
